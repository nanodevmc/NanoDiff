name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      tag: ${{ steps.extract_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Автопоиск версии из package.json
        id: extract_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Найденная версия: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэширование Rust зависимостей
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка npm зависимостей
        run: npm install

      - name: Сборка веб-бандла
        run: npm run build

      - name: Запуск интеграционных тестов
        run: node --experimental-strip-types scripts/test-runner.mjs

      - name: Сборка Tauri v2 (Windows NSIS & Portable)
        run: npm run tauri:build

      - name: Подготовка артефактов Windows
        shell: bash
        run: |
          mkdir -p artifacts
          VER="${{ needs.resolve-version.outputs.version }}"
          cp src-tauri/target/release/bundle/nsis/*.exe "artifacts/NanoDiff-Tauri-v${VER}-Windows-Setup.exe"
          cp src-tauri/target/release/nanodiff.exe "artifacts/NanoDiff-Tauri-v${VER}-Windows-Portable.exe"

      - name: Загрузка сборочных артефактов Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*
          if-no-files-found: error

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Установка системных библиотек Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libglib2.0-dev

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэширование Rust зависимостей
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Установка npm зависимостей
        run: npm install

      - name: Сборка веб-бандла
        run: npm run build

      - name: Запуск интеграционных тестов
        run: node --experimental-strip-types scripts/test-runner.mjs

      - name: Сборка Tauri v2 (Linux AppImage / Deb / Binary)
        run: npm run tauri:build

      - name: Подготовка артефактов Linux
        run: |
          mkdir -p artifacts
          VER="${{ needs.resolve-version.outputs.version }}"
          cp src-tauri/target/release/nanodiff "artifacts/NanoDiff-Tauri-v${VER}-Linux-x64"
          chmod +x "artifacts/NanoDiff-Tauri-v${VER}-Linux-x64"
          
          if compgen -G "src-tauri/target/release/bundle/appimage/*.AppImage" > /dev/null; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage "artifacts/NanoDiff-Tauri-v${VER}-Linux-x64.AppImage"
          fi
          
          if compgen -G "src-tauri/target/release/bundle/deb/*.deb" > /dev/null; then
            cp src-tauri/target/release/bundle/deb/*.deb "artifacts/NanoDiff-Tauri-v${VER}-Linux-x64.deb"
          fi

      - name: Загрузка сборочных артефактов Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    needs: [resolve-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачивание артефактов Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-files

      - name: Скачивание артефактов Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-files

      - name: Генерация контрольных сумм SHA256
        run: |
          cd release-files
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Подготовка release notes
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          cat << 'EOF' > release_notes.md
          ## 🚀 NanoDiff ${{ needs.resolve-version.outputs.tag }}

          Автоматическая кроссплатформенная сборка (Windows + Linux) через GitHub Actions.

          ### 📦 Загрузки для Windows:
          - **NanoDiff-Tauri-v${{ needs.resolve-version.outputs.version }}-Windows-Setup.exe** — автономный NSIS установщик (~1.35 МБ).
          - **NanoDiff-Tauri-v${{ needs.resolve-version.outputs.version }}-Windows-Portable.exe** — портативная версия без установки (~4 МБ).

          ### 🐧 Загрузки для Linux:
          - **NanoDiff-Tauri-v${{ needs.resolve-version.outputs.version }}-Linux-x64.AppImage** — портативный AppImage для любых дистрибутивов.
          - **NanoDiff-Tauri-v${{ needs.resolve-version.outputs.version }}-Linux-x64.deb** — пакет для Debian / Ubuntu / Mint.
          - **NanoDiff-Tauri-v${{ needs.resolve-version.outputs.version }}-Linux-x64** — нативный бинарник без обёртки.

          ### 🔒 Проверка целостности:
          - **checksums.txt** — SHA256 контрольные суммы всех бинарников.
          EOF

      - name: Публикация релиза на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "NanoDiff ${{ needs.resolve-version.outputs.tag }}"
          files: release-files/*
          body_path: release_notes.md
          prerelease: false
