[package]
name = "nanodiff"
version = "1.0.0"
description = "Universal Deep Archive and Code Inspector"
authors = ["NanoDev"]
license = "MIT"
edition = "2021"

[lib]
name = "nanodiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
